name: Static QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local links
        run: python scripts/check_static.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/route-plan.js
          node --check assets/recon.js
          node --check data/routes.js
          node --check sw.js
      - name: Check web manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null
