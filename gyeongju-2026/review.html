<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>제출 현황 | 경주 인문학 기행</title>
<link rel="stylesheet" href="studio.css">
<style>
[hidden]{display:none!important} form{margin-top:16px}.review-list{padding-left:1.2rem}.review-list li{margin:8px 0}
.report-data dt{font-weight:800;margin-top:16px}.report-data dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.review-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.review-photos img{display:block;width:100%;height:auto}
</style>
</head><body><header class="studio-head"><nav class="studio-nav" aria-label="사이트 내비게이션"><a class="logo" href="index.html">포항고등학교 경주 인문학 기행</a><div class="links"><a href="teacher.html">교사용 지도 자료</a><a href="report.html">학생 보고서</a></div></nav></header>
<main class="mainsection"><div class="frame">
<h1>탐구 보고서 제출 현황</h1>
<p id="availability" role="status">교사용 접수 시스템 연결을 준비 중입니다.</p>
<form id="login" hidden>
<div class="field"><label for="teacherCode">지도교사 코드</label><input id="teacherCode" type="password" autocomplete="off" required pattern="[a-zA-Z0-9_\-]{24,90}"></div>
<button class="btn" type="submit">제출 현황 열기</button>
</form>
<p id="reviewStatus" role="status"></p>
<section id="dashboard" hidden aria-labelledby="dashboardTitle">
<h2 id="dashboardTitle">접수 목록</h2><p id="summary"></p>
<div class="toolbar"><button type="button" class="btn alt" id="refresh">새로고침</button><button type="button" class="btn alt" id="logout">닫기</button></div>
<ul class="review-list" id="submissions"></ul>
</section>
<section id="reportDetail" hidden aria-labelledby="detailTitle">
<h2 id="detailTitle">보고서 확인</h2>
<dl class="report-data" id="reportData"></dl><div class="review-photos" id="reviewPhotos"></div>
<form id="reviewForm"><div class="field"><label for="decision">처리 상태</label><select id="decision"><option value="reviewed">확인 완료</option><option value="revision">보완 요청</option></select></div>
<div class="field"><label for="reviewNote">학생에게 전달할 의견</label><textarea id="reviewNote" maxlength="1000"></textarea></div>
<button type="submit" class="btn">저장</button></form>
<p id="detailStatus" role="status"></p>
</section>
</div></main><script type="module" src="review.js"></script></body></html>
